# ==========================================
# MOUSE & SCROLLBACK CONFIG
# ==========================================
# Enable mouse support (clicking, resizing panes, scrolling)
set -g mouse on

# Increase scrollback history limit (default is 2000)
set -g history-limit 50000

# Prevent auto-scrolling to the bottom when selecting text with the mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==========================================
# COPY MODE & CLIPBOARD (Vi Style)
# ==========================================
# Use Vi keys in copy mode
set-window-option -g mode-keys vi

# Enable system clipboard integration (OSC 52 / terminal clipboard)
set -s set-clipboard on

# Keybindings for copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================================
# QUALITY OF LIFE SETTINGS
# ==========================================
# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable 24-bit true color support
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Fast reload shortcut: Prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# ==========================================
# TEAM DEFAULTS (same as the lab Raspberry Pis)
# ==========================================
# Status bar on top
set-option -g status-position top

# Kill the current window without a confirmation prompt
bind & kill-window
