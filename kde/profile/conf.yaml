# Konsave profile for the shared Kubuntu desktop (WhiteSur-dark look).
# Trimmed from the laptop's Sequoia.knsv. Themes/icons are NOT in here: they're
# installed from upstream by modules/80-kde-theme.sh. Ghostty and tmux configs
# come from dotfiles/, not from this profile.
#
# Deliberately left out: kwinoutputconfig.json (monitor layout, per machine),
# plasma-localerc (region/locale, per machine), kconf_updaterc (KDE migration
# state), Kvantum/WhiteSur (theme files, from upstream).
save:
    configs:
        location: "$CONFIG_DIR"
        entries:
            - gtk-2.0
            - gtk-3.0
            - gtk-4.0
            - kate
            - Kvantum
            - dolphinrc
            - katerc
            - konsolerc
            - kcminputrc
            - kdeglobals
            - kglobalshortcutsrc
            - kscreenlockerrc
            - ksmserverrc
            - kwinrc
            - kwinrulesrc
            - plasma-org.kde.plasma.desktop-appletsrc
            - plasmarc
            - plasmashellrc
            - gtkrc
            - gtkrc-2.0
            - ksplashrc
            - kded5rc
            - spectaclerc
            - plasmanotifyrc
